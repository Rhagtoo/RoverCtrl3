name: Android CI (Branch Build)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build'
        required: true
        default: 'bugfixes-2026-04-05'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref }}
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.android
          ${{ env.ANDROID_HOME }}
        key: android-sdk-${{ runner.os }}
    
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-
    
    - name: Install Android SDK packages
      run: |
        # android-actions/setup-android@v3 сломан: экшен жёстко вызывает
        # `sdkmanager tools`, а пакет 'tools' удалён из новых cmdline-tools
        # (Warning: Failed to find package 'tools' → exit 1).
        # SDK уже есть в ubuntu-latest — работаем с ним напрямую.
        SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
        echo "SDK_ROOT=$SDK_ROOT"
        SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        [ -x "$SDKM" ] || SDKM=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
        echo "sdkmanager: $SDKM"
        yes | "$SDKM" --licenses > /dev/null 2>&1 || true
        "$SDKM" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      timeout-minutes: 15
    
    - name: Create local.properties
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
      run: |
        echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
    
    - name: Accept Android SDK licenses
      run: |
        timeout 30s yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      timeout-minutes: 2
    
    - name: Build with Gradle
      run: timeout 15m ./gradlew assembleDebug --no-daemon --stacktrace
      timeout-minutes: 20
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk