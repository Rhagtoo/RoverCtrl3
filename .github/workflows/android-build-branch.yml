name: Android CI (Branch Build)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build'
        required: true
        default: 'bugfixes-2026-04-05'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref }}
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.android
          ${{ env.ANDROID_HOME }}
        key: android-sdk-${{ runner.os }}
    
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          gradle-${{ runner.os }}-
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 'latest'
        accept-licenses: 'true'
      timeout-minutes: 10

    - name: Install Android SDK packages
      run: |
        sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      timeout-minutes: 10
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
    
    - name: Accept Android SDK licenses
      run: |
        timeout 30s yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      timeout-minutes: 2
    
    - name: Build with Gradle
      run: timeout 15m ./gradlew assembleDebug --no-daemon --stacktrace
      timeout-minutes: 20
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk